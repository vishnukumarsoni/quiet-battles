[build]
command = "npm ci && npm ci --prefix server --omit=dev && npm ci --prefix client && npm --prefix client run build"
publish = "client/dist"

[build.environment]
# Skip non-secret metadata values and the ignored local database only.
# Credential variables such as JWT_SECRET and ADMIN_PASSWORD remain scanned.
SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,CLIENT_URL,PORT,SITE_URL,ADMIN_NAME"
SECRETS_SCAN_OMIT_PATHS = "server/data/quiet-battles.sqlite"

[functions]
directory = "server/netlify/functions"
node_bundler = "esbuild"
# Sequelize loads these PostgreSQL packages dynamically at runtime.
external_node_modules = ["pg", "pg-hstore"]

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/api/sitemap.xml"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200