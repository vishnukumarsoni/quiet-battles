[build]
command = "npm ci && npm ci --prefix server --omit=dev && npm ci --prefix client && npm --prefix client run build"
publish = "client/dist"

[functions]
directory = "server/netlify/functions"
node_bundler = "esbuild"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200